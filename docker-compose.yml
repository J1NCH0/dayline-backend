name: dayline

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: dayline
      POSTGRES_PASSWORD: dayline
      POSTGRES_DB: dayline
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dayline -d dayline']
      interval: 2s
      timeout: 3s
      retries: 15

  postgres-test:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: dayline
      POSTGRES_PASSWORD: dayline
      POSTGRES_DB: dayline_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dayline -d dayline_test']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
